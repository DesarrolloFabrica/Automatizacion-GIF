<svg width="900" height="620" viewBox="0 0 900 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Diseño fuente para la esquina de las FlowCard. Implementación React con tema azul/violeta: FlowCard.tsx -->
  <defs>
    <!-- Gradiente suave azul pastel para las líneas -->
    <linearGradient id="lineBlue" x1="210" y1="120" x2="690" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AFC8FF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#7FA8F8" stop-opacity="0.62"/>
    </linearGradient>

    <!-- Gradiente radial muy sutil para los nodos -->
    <radialGradient id="nodeBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) rotate(90) scale(18)">
      <stop stop-color="#D9E7FF"/>
      <stop offset="1" stop-color="#8EADF8" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Brillo suave opcional para que se integre como fondo -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grupo principal: puedes bajar opacity si lo quieres aún más sutil -->
  <g opacity="0.72" stroke="url(#lineBlue)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- Puntos principales del cubo en vista isométrica -->
    <!-- Frente: A-B-C-D / Fondo: E-F-G-H -->
    <!-- A(300,190), B(525,260), C(525,455), D(300,385) -->
    <!-- E(420,105), F(645,175), G(645,370), H(420,300) -->

    <!-- Aristas exteriores visibles -->
    <path d="M300 190 L525 260 L525 455 L300 385 Z"/>
    <path d="M420 105 L645 175 L645 370 L420 300 Z"/>
    <path d="M300 190 L420 105"/>
    <path d="M525 260 L645 175"/>
    <path d="M525 455 L645 370"/>
    <path d="M300 385 L420 300"/>

    <!-- Aristas internas punteadas para profundidad -->
    <path d="M420 105 L420 300" stroke-dasharray="13 13" opacity="0.55"/>
    <path d="M420 300 L525 260" stroke-dasharray="13 13" opacity="0.55"/>
    <path d="M420 300 L300 385" stroke-dasharray="13 13" opacity="0.55"/>

    <!-- Malla interna: líneas paralelas en la cara superior -->
    <path d="M340 161.7 L565 231.7" opacity="0.38"/>
    <path d="M380 133.3 L605 203.3" opacity="0.38"/>
    <path d="M345 204 L465 119" opacity="0.34"/>
    <path d="M390 218 L510 133" opacity="0.34"/>
    <path d="M435 232 L555 147" opacity="0.34"/>
    <path d="M480 246 L600 161" opacity="0.34"/>

    <!-- Malla interna: cara frontal -->
    <path d="M300 238.8 L525 308.8" opacity="0.32"/>
    <path d="M300 287.5 L525 357.5" opacity="0.32"/>
    <path d="M300 336.3 L525 406.3" opacity="0.32"/>
    <path d="M356.3 207.5 L356.3 402.5" opacity="0.30"/>
    <path d="M412.5 225 L412.5 420" opacity="0.30"/>
    <path d="M468.8 242.5 L468.8 437.5" opacity="0.30"/>

    <!-- Malla interna: cara derecha -->
    <path d="M525 308.8 L645 223.8" opacity="0.30"/>
    <path d="M525 357.5 L645 272.5" opacity="0.30"/>
    <path d="M525 406.3 L645 321.3" opacity="0.30"/>
    <path d="M555 238.8 L555 433.8" opacity="0.28"/>
    <path d="M585 217.5 L585 412.5" opacity="0.28"/>
    <path d="M615 196.3 L615 391.3" opacity="0.28"/>

    <!-- Diagonales internas sutiles para parecer patrón técnico -->
    <path d="M300 190 L645 370" opacity="0.18"/>
    <path d="M420 105 L525 455" opacity="0.16"/>
    <path d="M300 385 L645 175" opacity="0.16"/>
    <path d="M525 260 L420 300" opacity="0.28" stroke-dasharray="8 12"/>
  </g>

  <!-- Nodos principales -->
  <g opacity="0.82">
    <circle cx="300" cy="190" r="8" fill="#9FB9FA"/>
    <circle cx="525" cy="260" r="8" fill="#9FB9FA"/>
    <circle cx="525" cy="455" r="8" fill="#9FB9FA"/>
    <circle cx="300" cy="385" r="8" fill="#9FB9FA"/>
    <circle cx="420" cy="105" r="8" fill="#9FB9FA"/>
    <circle cx="645" cy="175" r="8" fill="#9FB9FA"/>
    <circle cx="645" cy="370" r="8" fill="#9FB9FA"/>
    <circle cx="420" cy="300" r="8" fill="#9FB9FA"/>
  </g>

  <!-- Nodos secundarios en algunas intersecciones internas -->
  <g opacity="0.42" fill="#AFC8FF">
    <circle cx="356.3" cy="207.5" r="4"/>
    <circle cx="412.5" cy="225" r="4"/>
    <circle cx="468.8" cy="242.5" r="4"/>
    <circle cx="555" cy="238.8" r="4"/>
    <circle cx="585" cy="217.5" r="4"/>
    <circle cx="615" cy="196.3" r="4"/>
    <circle cx="356.3" cy="336.3" r="3.5"/>
    <circle cx="412.5" cy="357.5" r="3.5"/>
    <circle cx="468.8" cy="406.3" r="3.5"/>
  </g>
</svg>
