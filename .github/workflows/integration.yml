name: integration

on:
  push:
    branches: [integration]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump for this deployment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: integration-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY || 'cloud-run' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE || 'automatizacion-gif-integration' }}
  CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o' }}
  IMAGE_NAME: automatizacion-gif/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: integration
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub configuration
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          set -euo pipefail

          required_vars=(
            PROJECT_ID
            GCP_SA_KEY
            OPENAI_API_KEY
            GOOGLE_DRIVE_TOKEN_JSON
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub variable or secret: ${name}"
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import os
          import sys

          raw = os.environ.get("GCP_SA_KEY", "")
          if not raw.lstrip().startswith("{"):
              print(
                  "::error::GCP_SA_KEY must contain the full Google service account JSON. "
                  "It cannot be a Secret Manager secret name because GitHub must authenticate "
                  "to Google before it can read Secret Manager."
              )
              sys.exit(1)
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError as exc:
              print(f"::error::GCP_SA_KEY is not valid JSON: {exc}")
              sys.exit(1)

          required = ("type", "project_id", "client_email", "private_key")
          missing = [key for key in required if not payload.get(key)]
          if missing:
              print(f"::error::GCP_SA_KEY is missing required service account fields: {', '.join(missing)}")
              sys.exit(1)

          if payload.get("type") != "service_account":
              print("::error::GCP_SA_KEY must be a Google service account JSON key.")
              sys.exit(1)
          PY

          if [[ "${OPENAI_API_KEY}" == "{"* ]]; then
            echo "::error::OPENAI_API_KEY must contain the Secret Manager secret name, not the OpenAI key value."
            exit 1
          fi

          if [[ "${GOOGLE_DRIVE_TOKEN_JSON}" == "{"* ]]; then
            echo "::error::GOOGLE_DRIVE_TOKEN_JSON must contain the Secret Manager secret name, not the OAuth token JSON value."
            exit 1
          fi

      - name: Normalize deployment variables
        run: |
          trim_value() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          {
            echo "PROJECT_ID=$(trim_value "${PROJECT_ID}")"
            echo "REGION=$(trim_value "${REGION}")"
            echo "ARTIFACT_REPOSITORY=$(trim_value "${ARTIFACT_REPOSITORY}")"
            echo "SERVICE_NAME=$(trim_value "${SERVICE_NAME}")"
            echo "CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT=$(trim_value "${CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT}")"
            echo "OPENAI_MODEL=$(trim_value "${OPENAI_MODEL}")"
            echo "OPENAI_SECRET_NAME=$(trim_value "${OPENAI_SECRET_NAME}")"
            echo "GOOGLE_DRIVE_TOKEN_SECRET_NAME=$(trim_value "${GOOGLE_DRIVE_TOKEN_SECRET_NAME}")"
          } >> "$GITHUB_ENV"
        env:
          OPENAI_SECRET_NAME: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_DRIVE_TOKEN_SECRET_NAME: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}

      - name: Resolve image version
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail

          bump="${MANUAL_BUMP:-}"

          if [ -z "${bump}" ]; then
            labels="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              -H "Accept: application/vnd.github+json" \
              --jq '.[0].labels[].name' 2>/dev/null || true)"

            if printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)major$|^major$'; then
              bump="major"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)minor$|^minor$'; then
              bump="minor"
            elif printf '%s\n' "${labels}" | grep -Eiq '(^|:|/|-)patch$|^patch$'; then
              bump="patch"
            else
              bump="patch"
            fi
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "${latest_tag}" ]; then
            next_version="1.0.0"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version}"

            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "::error::Invalid version bump: ${bump}"
                exit 1
                ;;
            esac

            next_version="${major}.${minor}.${patch}"
          fi

          {
            echo "VERSION_BUMP=${bump}"
            echo "IMAGE_VERSION=${next_version}"
            echo "IMAGE_VERSION_TAG=v${next_version}"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe "${ARTIFACT_REPOSITORY}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
          || gcloud artifacts repositories create "${ARTIFACT_REPOSITORY}" \
            --project="${PROJECT_ID}" \
            --location="${REGION}" \
            --repository-format=docker \
            --description="Cloud Run container images"

      - name: Build image
        run: |
          IMAGE_BASE_URI="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}"
          IMAGE_URI_LATEST="${IMAGE_BASE_URI}:latest"
          IMAGE_URI_VERSION="${IMAGE_BASE_URI}:${IMAGE_VERSION_TAG}"

          docker build \
            -t "${IMAGE_URI_LATEST}" \
            -t "${IMAGE_URI_VERSION}" \
            .

          {
            echo "IMAGE_URI=${IMAGE_URI_VERSION}"
            echo "IMAGE_URI_LATEST=${IMAGE_URI_LATEST}"
            echo "IMAGE_URI_VERSION=${IMAGE_URI_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Push image
        run: |
          docker push "${IMAGE_URI_LATEST}"
          docker push "${IMAGE_URI_VERSION}"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          image: ${{ env.IMAGE_URI }}
          region: ${{ env.REGION }}
          flags: >-
            --allow-unauthenticated
            --port=8000
            --memory=2Gi
            --cpu=2
            --timeout=3600
            --concurrency=1
            --max-instances=3
            ${{ env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT != '' && format('--service-account={0}', env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT) || '' }}
          env_vars: |
            OPENAI_MODEL=${{ env.OPENAI_MODEL }}
            AUTOMATIZACION_GIF_JOBS_ROOT=/tmp/automatizacion-gif/jobs
            AUTOMATIZACION_GIF_DRIVE_CONTENT_ROOT=/tmp/automatizacion-gif/drive_content
          secrets: |
            OPENAI_API_KEY=${{ env.OPENAI_SECRET_NAME }}:latest
            GOOGLE_DRIVE_TOKEN_JSON=${{ env.GOOGLE_DRIVE_TOKEN_SECRET_NAME }}:latest

      - name: Show service URL
        run: |
          gcloud run services describe "${SERVICE_NAME}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --format "value(status.url)"

      - name: Create GitHub version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${IMAGE_VERSION_TAG}" -m "integration ${IMAGE_VERSION_TAG} (${VERSION_BUMP})"
          git push origin "${IMAGE_VERSION_TAG}"

      - name: Show Cloud Run logs on failure
        if: failure() && env.GOOGLE_GHA_CREDS_PATH != ''
        run: |
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --limit 50 \
            --format "value(timestamp,severity,textPayload)"
